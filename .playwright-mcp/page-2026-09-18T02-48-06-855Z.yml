- generic [active] [ref=f2e1]:
  - banner [ref=f2e2]:
    - paragraph [ref=f2e3]: 海员培训小程序 · 设计评审
    - heading "首页视觉稿" [level=1] [ref=f2e4]
    - paragraph [ref=f2e5]: 这版针对「细节不够精心」重做了 12 处。右栏是 375px 实尺稿，可直接滚动看完六层楼。文案与数字为示例数据，用于展示真实排布。
  - main [ref=f2e6]:
    - generic [ref=f2e7]:
      - heading "逐条改动" [level=2] [ref=f2e8]
      - paragraph [ref=f2e9]: 对应右栏，自上而下
      - list [ref=f2e10]:
        - listitem [ref=f2e11]:
          - generic [ref=f2e12]: 渐变改为三段 + 叠径向高光
          - text: 原来两端直连，右上角发闷。现在 165° 三段过渡，再叠一层偏右上角的白色高光。
        - listitem [ref=f2e13]:
          - generic [ref=f2e14]: 标题加负字距，副标题降到 72% 白
          - text: 大字不加字距会散；副标题用 62%/72% 两档白，和标题拉开层次而不是只靠字号。
        - listitem [ref=f2e15]:
          - generic [ref=f2e16]: 搜索框从半透明改为实心白
          - text: 半透明白压在渐变浅端几乎没有边界，输入区看不出范围。实心白 + 4px 投影，位置一眼可辨。
        - listitem [ref=f2e17]:
          - generic [ref=f2e18]: 金刚区图标/外框比例 0.36 → 0.47
          - text: 原 132rpx 方框配 48rpx 图标，图标孤零零悬在中间。现在 64px 框配 30px 图标，并加内高光让灰块有厚度。
        - listitem [ref=f2e19]:
          - generic [ref=f2e20]: 倒计时挪到封面图上
          - text: 卡片内少一层信息。图片底部加黑色渐变遮罩保证文字可读 —— 压图必配遮罩，不能直接压。
        - listitem [ref=f2e21]:
          - generic [ref=f2e22]: 卡片阴影改为几乎不可见
          - code [ref=f2e23]: 0 2px 10px rgba(20,30,60,.06)
          - text: "。刻意保留而非去掉：在 #F5F7FA 浅灰带上，纯白卡片需要一点点投影才有层次，但不能重到发\"贴纸感\"。"
        - listitem [ref=f2e24]:
          - generic [ref=f2e25]: 余位进度条的轨道从主题色改为冷灰
          - text: "原来是整条蓝，和价格抢视觉。现在轨道 #E8EBF0、填充才用品牌蓝，只做氛围不做主角；数字等宽，滚动不抖。"
        - listitem [ref=f2e26]:
          - generic [ref=f2e27]: 课程列表分隔线内缩到文字左边缘
          - text: 原来通栏分隔线横穿缩略图，把一行切两半。现在线从文字列开始，视线自然沿文字走 —— 这是 Apple 列表的常规做法。
        - listitem [ref=f2e28]:
          - generic [ref=f2e29]: 所有数字改用 tabular-nums
          - text: 价格、余位、日期、时间：等宽数字，列表滚动和数字变化时宽度不跳动。
        - listitem [ref=f2e30]:
          - generic [ref=f2e31]: 缩略图统一 84px / 圆角 14px，与文字顶对齐
          - text: 原来缩略图和文字块等高，文字少时价格被
          - code [ref=f2e32]: margin-top:auto
          - text: 顶到底部，行高参差。
        - listitem [ref=f2e33]:
          - generic [ref=f2e34]: 流程节点 32px、连接线 1px、节点用近黑
          - text: 原来节点是品牌蓝、线是 2rpx。流程是结构信息不是操作入口，不该用强调色；线细一档更利落。
        - listitem [ref=f2e35]:
          - generic [ref=f2e36]: 间距收敛到 4px 基准
          - text: 全部内距、外边距、间隙取自 4 / 8 / 12 / 16 / 24 / 32 / 96，不再出现 5、6、14、22 这类随手值。
