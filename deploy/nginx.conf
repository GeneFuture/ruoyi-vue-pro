# 单容器：nginx 监听 80，托管前端 + 反代 Spring Boot（127.0.0.1:48080）
# 该文件由 Dockerfile 复制到 /etc/nginx/http.d/default.conf

# 云托管外层负载均衡一般会带 X-Forwarded-Proto；没有时退回 nginx 自身协议
map $http_x_forwarded_proto $proxy_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart 限制保持一致
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # ==================== 后端 API ====================
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_read_timeout 120s;
    }

    # 小程序端接口：与后台共用同一个域名时使用
    location /app-api/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_read_timeout 120s;
    }

    # ==================== WebSocket（IM / 站内通知） ====================
    location /infra/ws {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== 健康检查 ====================
    # 云托管健康检查路径请配置为 /actuator/health：
    # Java 进程异常时这里返回 502，平台可以感知并重建实例
    location = /actuator/health {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $host;
    }

    # ==================== 前端静态资源 ====================
    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
